            <script>function neighbourhoodHighlight(params) {
  // console.log("in nieghbourhoodhighlight");
  allNodes = nodes.get({ returnType: "Object" });
  // originalNodes = JSON.parse(JSON.stringify(allNodes));
  // if something is selected:
  if (params.nodes.length > 0) {
    highlightActive = true;
    var i, j;
    var selectedNode = params.nodes[0];
    var degrees = 2;

    // mark all nodes as hard to read.
    for (let nodeId in allNodes) {
      // nodeColors[nodeId] = allNodes[nodeId].color;
      allNodes[nodeId].color = "rgba(200,200,200,0.5)";
      if (allNodes[nodeId].hiddenLabel === undefined) {
        allNodes[nodeId].hiddenLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }
    var connectedNodes = network.getConnectedNodes(selectedNode);
    var allConnectedNodes = [];

    // get the second degree nodes
    for (i = 1; i < degrees; i++) {
      for (j = 0; j < connectedNodes.length; j++) {
        allConnectedNodes = allConnectedNodes.concat(
          network.getConnectedNodes(connectedNodes[j])
        );
      }
    }

    // all second degree nodes get a different color and their label back
    for (i = 0; i < allConnectedNodes.length; i++) {
      // allNodes[allConnectedNodes[i]].color = "pink";
      allNodes[allConnectedNodes[i]].color = "rgba(150,150,150,0.75)";
      if (allNodes[allConnectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[allConnectedNodes[i]].label =
          allNodes[allConnectedNodes[i]].hiddenLabel;
        allNodes[allConnectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // all first degree nodes get their own color and their label back
    for (i = 0; i < connectedNodes.length; i++) {
      // allNodes[connectedNodes[i]].color = undefined;
      allNodes[connectedNodes[i]].color = nodeColors[connectedNodes[i]];
      if (allNodes[connectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[connectedNodes[i]].label =
          allNodes[connectedNodes[i]].hiddenLabel;
        allNodes[connectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // the main node gets its own color and its label back.
    // allNodes[selectedNode].color = undefined;
    allNodes[selectedNode].color = nodeColors[selectedNode];
    if (allNodes[selectedNode].hiddenLabel !== undefined) {
      allNodes[selectedNode].label = allNodes[selectedNode].hiddenLabel;
      allNodes[selectedNode].hiddenLabel = undefined;
    }
  } else if (highlightActive === true) {
    // console.log("highlightActive was true");
    // reset all nodes
    for (let nodeId in allNodes) {
      // allNodes[nodeId].color = "purple";
      allNodes[nodeId].color = nodeColors[nodeId];
      // delete allNodes[nodeId].color;
      if (allNodes[nodeId].hiddenLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].hiddenLabel;
        allNodes[nodeId].hiddenLabel = undefined;
      }
    }
    highlightActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    // console.log("Nothing was selected");
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        // allNodes[nodeId].color = {};
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function filterHighlight(params) {
  allNodes = nodes.get({ returnType: "Object" });
  // if something is selected:
  if (params.nodes.length > 0) {
    filterActive = true;
    let selectedNodes = params.nodes;

    // hiding all nodes and saving the label
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = true;
      if (allNodes[nodeId].savedLabel === undefined) {
        allNodes[nodeId].savedLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }

    for (let i=0; i < selectedNodes.length; i++) {
      allNodes[selectedNodes[i]].hidden = false;
      if (allNodes[selectedNodes[i]].savedLabel !== undefined) {
        allNodes[selectedNodes[i]].label = allNodes[selectedNodes[i]].savedLabel;
        allNodes[selectedNodes[i]].savedLabel = undefined;
      }
    }

  } else if (filterActive === true) {
    // reset all nodes
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = false;
      if (allNodes[nodeId].savedLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].savedLabel;
        allNodes[nodeId].savedLabel = undefined;
      }
    }
    filterActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function selectNode(nodes) {
  network.selectNodes(nodes);
  neighbourhoodHighlight({ nodes: nodes });
  return nodes;
}

function selectNodes(nodes) {
  network.selectNodes(nodes);
  filterHighlight({nodes: nodes});
  return nodes;
}

function highlightFilter(filter) {
  let selectedNodes = []
  let selectedProp = filter['property']
  if (filter['item'] === 'node') {
    let allNodes = nodes.get({ returnType: "Object" });
    for (let nodeId in allNodes) {
      if (allNodes[nodeId][selectedProp] && filter['value'].includes((allNodes[nodeId][selectedProp]).toString())) {
        selectedNodes.push(nodeId)
      }
    }
  }
  else if (filter['item'] === 'edge'){
    let allEdges = edges.get({returnType: 'object'});
    // check if the selected property exists for selected edge and select the nodes connected to the edge
    for (let edge in allEdges) {
      if (allEdges[edge][selectedProp] && filter['value'].includes((allEdges[edge][selectedProp]).toString())) {
        selectedNodes.push(allEdges[edge]['from'])
        selectedNodes.push(allEdges[edge]['to'])
      }
    }
  }
  selectNodes(selectedNodes)
}</script>

        else if(type === 'proyek') content.innerHTML = htmlProyekData;
        else if(type === 'periset') content.innerHTML = htmlPerisetData;
        document.getElementById('summary-modal').style.display = 'flex';
    };

    window.toggleSidebar = function() {
        var sb = document.getElementById('dashboard-sidebar');
        var icon = document.getElementById('toggle-icon');
        var title = document.getElementById('sidebar-title');
        if(sb.classList.contains('collapsed')) { sb.classList.remove('collapsed'); icon.innerText = '<'; title.style.display = 'inline'; } 
        else { sb.classList.add('collapsed'); icon.innerText = '>'; title.style.display = 'none'; }
    };

    window.toggleAcc = function(contentId, btn) {
        var content = document.getElementById(contentId);
        var arrow = btn.querySelector('.arrow');
        if (content.style.display === 'block') { content.style.display = 'none'; arrow.innerText = 'v'; } 
        else { content.style.display = 'block'; arrow.innerText = '^'; }
    };

    function showPanelInfo(nodeId) {
        var nodeData = nodes.get(nodeId); 
        if (nodeData && nodeData.title) {
            var closeBtn = `<span style="position:absolute; right:15px; top:10px; cursor:pointer; font-size:20px; font-weight:bold; color:#aaa;" onclick="document.getElementById('info-panel').style.display='none'">X</span>`;
            infoPanel.innerHTML = closeBtn + nodeData.title; 
            infoPanel.style.display = 'block';
        }
    }

    network.on("click", function(params) {
        if (params.nodes.length > 0) { showPanelInfo(params.nodes[0]); } 
        else { infoPanel.style.display = 'none'; }
    });

    window.resetHighlight = function() {
        var allN = nodes.get();
        var updates = allN.map(n => ({ id: n.id, hidden: false }));
        nodes.update(updates);
        network.fit({ animation: { duration: 1000 } });
        document.getElementById('input-global').value = '';
        document.getElementById('sel-kel').value = '';
        document.getElementById('sel-rst').value = '';
        document.getElementById('sel-pst').value = '';
        infoPanel.style.display = 'none';
    };

    window.selectSpecific = function(selectElem) {
        var val = selectElem.value;
        if(val === "") { window.resetHighlight(); return; }
        
        if(selectElem.id !== 'sel-kel') document.getElementById('sel-kel').value = '';
        if(selectElem.id !== 'sel-rst') document.getElementById('sel-rst').value = '';
        if(selectElem.id !== 'sel-pst') document.getElementById('sel-pst').value = '';
        document.getElementById('input-global').value = '';
        
        var allN = nodes.get();
        var toShow = new Set([val]);
        var level1 = network.getConnectedNodes(val);
        level1.forEach(id => toShow.add(id));
        
        if (selectElem.id === 'sel-kel') {
            level1.forEach(id => { network.getConnectedNodes(id).forEach(l2id => toShow.add(l2id)); });
        } else if (selectElem.id === 'sel-pst') {
            level1.forEach(id => { 
                network.getConnectedNodes(id).forEach(l2id => {
                    var l2Obj = allN.find(n => n.id === l2id);
                    if(l2Obj && l2Obj.group === 'kelompok') toShow.add(l2id);
                }); 
            });
        }
        
        var updates = allN.map(n => ({ id: n.id, hidden: !toShow.has(n.id) }));
        nodes.update(updates);
        network.fit({ nodes: Array.from(toShow), animation: { duration: 1000, easingFunction: "easeInOutQuad" } });
        showPanelInfo(val);
    };

    window.searchGlobal = function() {
        var text = document.getElementById('input-global').value.toLowerCase();
        if (!text) { window.resetHighlight(); return; }
        
        document.getElementById('sel-kel').value = '';
        document.getElementById('sel-rst').value = '';
        document.getElementById('sel-pst').value = '';

        var allN = nodes.get(); 
        var matchedIds = [];
        for (var i = 0; i < allN.length; i++) {
            if (allN[i].label && allN[i].label.toLowerCase().includes(text)) { matchedIds.push(allN[i].id); }
        }

        if (matchedIds.length > 0) {
            var toShow = new Set(matchedIds);
            matchedIds.forEach(id => { network.getConnectedNodes(id).forEach(connId => toShow.add(connId)); });
            var updates = allN.map(n => ({ id: n.id, hidden: !toShow.has(n.id) }));
            nodes.update(updates);
            network.fit({ nodes: Array.from(toShow), animation: { duration: 1000, easingFunction: "easeInOutQuad" } });
            if(matchedIds.length === 1) { showPanelInfo(matchedIds[0]); }
        } else { 
            // MEMUNCULKAN MODAL "NOT FOUND" DI TENGAH LAYAR
            var content = document.getElementById('modal-content');
            content.innerHTML = `
                <div style='display:flex; justify-content:space-between; align-items:center; border-bottom: 2px solid #ddd; padding-bottom:10px; margin-top:0;'>
                    <h2 style='color:#d9534f; margin:0;'>Pemberitahuan</h2>
                    <button onclick="document.getElementById('summary-modal').style.display='none'" style="background:#d9534f; color:white; border:none; border-radius:4px; padding:6px 12px; font-weight:bold; cursor:pointer;">Close</button>
                </div>
                <div style='text-align:center; padding: 60px 0;'>
                    <h2 style='color:#d9534f; margin:0;'>Not Found</h2>
                    <p style='color:#666; font-size:15px; margin-top:10px;'>Data atau nama yang Anda cari tidak ditemukan.</p>
                </div>
            `;
            document.getElementById('summary-modal').style.display = 'flex';
        }
    };

    window.handleEnter = function(e) { if (e.key === 'Enter') window.searchGlobal(); };

</script>
</body>
</html>
